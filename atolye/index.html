<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Atölye: 30 gün Python, tarayıcıda çalışan dersler</title>
    <meta name="description" content="30 Days of Python dersleri: her örnek tarayıcıda çalışır, ilerlemen günlük olarak saklanır." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#e8e7e3" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%232456d6'/%3E%3Cpath d='M9 9l9 7-9 7' fill='none' stroke='%23fff' stroke-width='3.4'/%3E%3Crect x='19' y='22' width='6' height='3' fill='%23fff'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=League+Spartan:wght@700&display=swap" rel="stylesheet" />
    <script>
      /* Set the theme and the "js" flag before first paint so nothing flashes and no-JS visitors still see everything. */
      try {
        document.documentElement.classList.add('js')
        var s = JSON.parse(localStorage.getItem('atolye:v1') || 'null')
        var t = s && s.theme
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
        /* the saved language (or the old per-exercise switch it replaced) goes on <html lang> before first paint */
        var l = localStorage.getItem('atolye:lang') || (s && s.settings && s.settings.lang) || 'tr'
        document.documentElement.lang = l === 'en' ? 'en' : 'tr'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <main style="font-family:system-ui,sans-serif;max-width:40rem;margin:4rem auto;padding:0 1rem;line-height:1.5">
        <h1>Atölye: 30 gün Python</h1>
        <p>Dersleri tarayıcıda çalıştırmak için JavaScript gerekir. Yine de ilk dersi okuyabilirsin:</p>
        <p><a href="https://github.com/Asabeneh/30-Days-Of-Python/blob/master/readme.md">Gün 1: Introduction (GitHub)</a></p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
